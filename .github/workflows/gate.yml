name: Noether Gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  approve-if-no-violation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [easy-ledger, medium-orders, hard-journal]
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          directory: examples/${{ matrix.example }}/lean
      - name: Search for a proved violation
        run: python3 scripts/gate.py --example ${{ matrix.example }}

  deny-if-fixture-is-bad:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [easy-ledger, medium-orders, hard-journal]
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          directory: examples/${{ matrix.example }}/lean
          build: false
      - name: Expect Lean to accept a violation proof
        run: python3 scripts/gate.py --example ${{ matrix.example }} --use-bad-fixture --expect-deny
