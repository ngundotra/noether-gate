name: Retell
on:
  pull_request:
  workflow_dispatch:

jobs:
  retell:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Write the retelling card
        run: |
          {
            echo "A PR lands. This is the Lean-facing retelling of the checked-in rules."
            echo
            python3 scripts/retell.py --example easy-ledger --ending match
            echo
            python3 scripts/retell.py --example medium-orders --ending match
            echo
            python3 scripts/retell.py --example hard-journal --ending match
          } > /tmp/retell.md
          cat /tmp/retell.md
      - name: Comment on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/retell.md', 'utf8');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
